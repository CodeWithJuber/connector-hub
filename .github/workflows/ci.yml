name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Check formatting
        run: uv run ruff format --check hub/base.py hub/mcp_server.py tests/unit
      - name: Lint
        run: uv run ruff check hub/base.py hub/mcp_server.py tests/unit
      - name: Type check
        run: uv run mypy
      - name: Test without external network integrations
        run: uv run pytest tests/unit
      - name: Build distributions
        run: uv build

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file /tmp/runtime-requirements.txt
          uv run pip-audit --require-hashes --no-deps -r /tmp/runtime-requirements.txt
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  protected-integration:
    name: Protected real-data integration
    if: github.event_name == 'workflow_dispatch'
    environment: protected-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - run: uv sync --frozen --all-groups
      - name: Run opt-in integrations
        run: uv run pytest -m integration tests/integration
        env:
          RUN_INTEGRATION: "1"
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
