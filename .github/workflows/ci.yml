name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2
        with:
          workspaces: crates
      - name: Check formatting
        run: cargo fmt --check
        working-directory: crates
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates
      - name: Test
        run: cargo test --workspace
        working-directory: crates
      - name: Validate installation
        run: cargo run --manifest-path crates/Cargo.toml -- validate

  manifests:
    name: Manifest version parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check manifest versions match
        run: |
          set -euo pipefail
          versions=$(jq -r '.version' \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json \
            kimi.plugin.json | sort -u)
          count=$(echo "$versions" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "ERROR: Plugin manifest versions do not match:"
            echo "  .claude-plugin/plugin.json:       $(jq -r .version .claude-plugin/plugin.json)"
            echo "  .claude-plugin/marketplace.json:   $(jq -r .version .claude-plugin/marketplace.json)"
            echo "  .codex-plugin/plugin.json:         $(jq -r .version .codex-plugin/plugin.json)"
            echo "  kimi.plugin.json:                  $(jq -r .version kimi.plugin.json)"
            exit 1
          fi
          echo "All manifests at version: $versions"

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          sudo install --owner=root --group=root --mode=0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan repository for secrets
        run: gitleaks git --redact --no-banner --log-opts="--all"

  protected-integration:
    name: Protected real-data integration
    if: github.event_name == 'workflow_dispatch'
    environment: protected-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2
        with:
          workspaces: crates
      - name: Run opt-in integrations
        run: cargo test --workspace -- --ignored
        working-directory: crates
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
