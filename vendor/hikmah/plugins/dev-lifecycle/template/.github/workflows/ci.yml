name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      # NOTE: `bun run build` is intentionally NOT run here — the build script
      # is `gt translate --publish && next build`, which PUBLISHES translations
      # (outward side effect + requires the GT secret). If a pure build gate is
      # wanted later, add a `build:ci` script that runs `next build` only, wire
      # the required NEXT_PUBLIC_* env, and add it as a separate job.
