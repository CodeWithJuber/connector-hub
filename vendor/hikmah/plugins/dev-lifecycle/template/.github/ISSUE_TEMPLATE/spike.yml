name: '🔬 Spike / Research'
description: A timeboxed investigation that ends in a decision or follow-up issues.
labels: ['type:spike']
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: e.g. 1 day
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Expected deliverable
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area # ← customize options to your domains
      multiple: true
      options: [backend, frontend, api, infra, docs]
    validations:
      required: true
