# Canonical label taxonomy — mirrors .github/dev-workflow.yml `taxonomy`.
# scripts/bootstrap-project.sh creates/updates these idempotently.
# Customize the `area:*` set to match your project's domains.

# --- Type ---
- name: 'type:feature'
  color: 'a2eeef'
  description: 'New capability or enhancement'
- name: 'type:bug'
  color: 'd73a4a'
  description: 'Bug or defect'
- name: 'type:chore'
  color: 'fef2c0'
  description: 'Maintenance, deps, tooling, cleanup'
- name: 'type:refactor'
  color: 'c5def5'
  description: 'Restructure without behavior change'
- name: 'type:docs'
  color: '0075ca'
  description: 'Documentation only'
- name: 'type:spike'
  color: 'd4c5f9'
  description: 'Timeboxed research / investigation'

# --- Priority ---
- name: 'priority:p0'
  color: 'b60205'
  description: 'Critical — drop everything'
- name: 'priority:p1'
  color: 'd93f0b'
  description: 'High — next up'
- name: 'priority:p2'
  color: 'fbca04'
  description: 'Medium — soon'
- name: 'priority:p3'
  color: '0e8a16'
  description: 'Low — nice to have'

# --- Area (CUSTOMIZE to your domains) ---
- name: 'area:backend'
  color: 'ededed'
  description: 'Backend / server / DB'
- name: 'area:frontend'
  color: 'ededed'
  description: 'UI / client'
- name: 'area:api'
  color: 'ededed'
  description: 'API / integrations'
- name: 'area:infra'
  color: 'ededed'
  description: 'CI / tooling / workflow'
- name: 'area:docs'
  color: 'ededed'
  description: 'Project documentation'

# --- Workflow state ---
- name: 'needs-human-review'
  color: 'e11d48'
  description: 'Sensitive/uncertain — a human must approve before merge'
- name: 'ready'
  color: '0e8a16'
  description: 'Triaged and ready to start'
- name: 'blocked'
  color: '5319e7'
  description: 'Waiting on something else'
