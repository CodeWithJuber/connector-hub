[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-connector-hub"
version = "1.0.0"
description = "A stdlib-first MCP gateway for service connectors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Connector Hub contributors"}]
dependencies = []

[project.scripts]
connector-hub = "hub.gateway:main"

[tool.setuptools.packages.find]
include = ["hub*", "connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
