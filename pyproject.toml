[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "omni-connector-hub"
version = "1.1.0"
description = "A typed stdio MCP gateway for service connectors"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Omni Connector Hub maintainers" }]
dependencies = ["pydantic==2.12.5"]

[project.scripts]
connector-hub = "hub.gateway:main"
connector-hub-mcp = "hub.mcp_server:serve"

[dependency-groups]
dev = [
  "build==1.3.0",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-timeout==2.4.0",
  "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["hub", "connectors"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["verifier", "connectors", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S310", "S311", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"connectors/ops/ssh_bash.py" = ["S602"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["hub/schema.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --timeout=10"
testpaths = ["tests"]
markers = [
  "integration: opt-in tests that contact documented provider endpoints",
  "credentialed: integration tests requiring protected credentials",
]
